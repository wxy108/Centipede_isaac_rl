# Stage B-v0 Pass 4 RL smoke config (PPO, rl_games)
#
# This config is sized for a CONSERVATIVE smoke run, not for final
# training performance. Goals:
#   - Verify the full RL training loop runs end-to-end without crash.
#   - num_envs=16 (capacity-sweep safe ceiling for stable behaviour;
#     32 is the verified upper bound on this hardware, 48+ silently
#     produces NaN torque mid-settle).
#   - horizon_length=32 -> batch_size = 16 * 32 = 512.
#   - minibatch_size=128 -> 4 minibatches per epoch (512 / 128 == 0).
#     Avoids the rl_games batch divisibility assertion the project
#     hit in Cartpole-64 earlier.
#   - max_epochs=10 (= 10 PPO iterations). Enough to confirm the
#     update path; nowhere near convergence.
#   - mini_epochs=4: PPO inner-loop epochs over the rollout buffer.
#   - learning_rate small (3e-4) to keep the smoke run numerically
#     calm even with random Stage A controller behaviour underneath.
#
# Key invariants (verified at smoke time by the wrapper):
#   batch_size = num_actors * horizon_length
#   batch_size % minibatch_size == 0
#
# Network: small actor-critic MLP (256, 128). Plenty of capacity for
# a 6-D action / 86-D obs problem; keeps the smoke run fast on the
# RTX 5070 Laptop's 8 GB VRAM.

params:
  seed: 42

  # rl_games' ActionsClip wrapper is OFF — our env's _bounded_scale
  # already maps tanh(action) to a bounded scale, so additional clip
  # would just shrink the effective range. Keep clip large so it's
  # essentially a no-op safety net.
  env:
    clip_actions: 5.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -0.7                  # Pass 6 (audit-driven): was 0.
                                     # exp(-0.7) ~= 0.50 -> sigma_init = 0.50.
                                     # Audit found |raw_a|>2 in 99.9% of
                                     # trained-policy steps. With sigma=1.0
                                     # locked, training-time noise pushed mu
                                     # to the saturation rails to be
                                     # 'stable under noise'. Halving the
                                     # init exploration variance (and
                                     # making it learnable below) lets PPO
                                     # commit to smoother actions once the
                                     # policy starts improving.
        fixed_sigma: False           # Pass 6 (audit-driven): was True.
                                     # Allow logstd to be a learnable
                                     # parameter so PPO decays exploration
                                     # noise over training.
    mlp:
      units: [256, 128]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False
  load_path: ''

  config:
    name: centipede_stage_b_transition_global6d_smoke
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False              # off for the smoke; reduces
                                        # spurious NaN risk during
                                        # an unconverged PPO warmup
    normalize_input: True               # observation running mean/std
    normalize_value: True
    value_bootstrap: True
    num_actors: -1                      # set from script (= num_envs)
    reward_shaper:
      scale_value: 1.0                  # don't rescale our already-
                                        # tuned r weights
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 0.0003               # 3e-4; small for smoke
                                        # NOTE: written as a plain
                                        # decimal because PyYAML parses
                                        # `1.0e9` (no sign on exponent)
                                        # as a STRING — see score_to_win
                                        # below for the same gotcha.
    lr_schedule: adaptive
    schedule_type: legacy
    # 2026-05-09: 0.01 → 0.005 (HALVED) to slow PPO per-update drift
    # after observing the same "early best, soft drift" pattern in
    # Pass 8 (50 ep), Pass 10 v1 (15 ep), Pass 10 v2 (15 ep), and
    # Pass 11 v1.1 (30 ep). adaptive lr schedule shrinks the LR by 1.5×
    # whenever realized KL exceeds 2× kl_threshold, so halving the
    # threshold makes the schedule more eagerly throttle drift.
    # Project memory pre-identified this as the single-knob fix
    # for soft-collapse: see project_centipede_pass8_smoothing_validated.md.
    kl_threshold: 0.005
    # PyYAML parses `1.0e9` as a string ("1.0e9") because the YAML
    # 1.1 spec requires the exponent to have an explicit sign or the
    # mantissa to have a decimal point INSIDE the integer (e.g. `1e9`
    # is also a string). Use a literal int or `1.0e+9` to force float.
    # rl_games does numpy `>` between this and a Float32 reward; a
    # string trips `_UFuncNoLoopError: ufunc 'greater' did not contain
    # a loop with signature matching types Float32 / Str`.
    score_to_win: 1000000000.0          # 1e9; smoke never auto-stops
    max_epochs: 10                      # SMOKE: 10 PPO iterations only
    save_best_after: 5
    save_frequency: 5
    grad_norm: 1.0
    entropy_coef: 0.005
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 32                  # rollout length per env
    minibatch_size: 128                 # 16 envs * 32 horizon = 512
                                        # 512 / 128 = 4 minibatches/epoch
    mini_epochs: 4
    critic_coef: 2.0
    clip_value: True
    seq_length: 4
    bounds_loss_coef: 0.005           # Pass 6 (audit-driven): was 0.0.
                                      # rl_games adds (mu^2 - 1)^2 [if mu
                                      # outside [-1,1]] to the actor loss.
                                      # Audit showed |raw_a|>2 99.9% of
                                      # the time and |raw_a|>3 99.7%; the
                                      # tanh derivative there is ~e^-10,
                                      # so PPO gradient through
                                      # _bounded_scale vanished. A small
                                      # bounds-loss pulls mu back toward
                                      # the well-behaved [-1,1] region
                                      # where the action map is locally
                                      # near-linear.
